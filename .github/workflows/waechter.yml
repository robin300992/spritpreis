name: Wächter

# Stößt den Heizungs-Agenten (privates Repo heizung) an, wenn GitHub
# dessen zeitgesteuerte Läufe auslässt. Läuft hier im öffentlichen Repo,
# kostet daher keine Freiminuten. Secret: WAECHTER_TOKEN (Actions: Read and write auf heizung).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: waechter
  cancel-in-progress: true

jobs:
  heizung:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Heizung anstoßen, falls überfällig
        env:
          GH_TOKEN: ${{ secrets.WAECHTER_TOKEN }}
          REPO: robin300992/heizung
        run: |
          stunde=$(TZ=Europe/Berlin date +%-H)
          # tagsüber (6-21 Uhr) stündlich, nachts alle 2 Stunden
          if [ "$stunde" -ge 6 ] && [ "$stunde" -le 21 ]; then grenze=65; else grenze=125; fi
          letzter=$(gh run list -R "$REPO" -w heizung.yml -L 1 --json createdAt -q '.[0].createdAt')
          alter=$(( ( $(date +%s) - $(date -d "$letzter" +%s) ) / 60 ))
          echo "Letzter Heizungs-Lauf vor $alter Minuten (Grenze $grenze)"
          if [ "$alter" -ge "$grenze" ]; then
            gh workflow run heizung.yml -R "$REPO" -f modus=auto
            echo "Heizung angestoßen"
          fi
