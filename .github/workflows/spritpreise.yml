name: Spritpreise

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub startet manchmal etwas verspätet)
  workflow_dispatch:          # manuell: Actions › Spritpreise › Run workflow

permissions:
  contents: write

concurrency:
  group: spritpreise
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Agent-Lauf (wahrnehmen, bewerten, lernen, entscheiden, handeln)
        run: python3 scripts/update.py
        env:
          TK_API_KEY: ${{ secrets.TK_API_KEY }}
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LNG: ${{ secrets.HOME_LNG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADIUS_KM: "15"
          KEEP_DAYS: "14"

      - name: Daten speichern
        run: |
          git config user.name "spritpreis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet && exit 0
          git commit -q -m "Preise $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git pull -q --rebase && git push -q
